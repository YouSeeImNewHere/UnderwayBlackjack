# Builds the Android app from android/ (which compiles the same C++ via the
# repo-root CMakeLists.txt).
#   - Every push: a debug APK for quick testing (artifact
#     "UnderwayBlackjack-android-apk"). It installs as a separate app,
#     "Blackjack Variants (dev)", and is signed with a throwaway key.
#   - A v* tag (a GitHub Release): a release APK signed with YOUR upload key,
#     attached to the release as UnderwayBlackjack-android.apk, plus a
#     signed App Bundle (.aab) for Google Play. Every release must be signed
#     with the same key, or Android (and Obtainium) refuse to install it as
#     an update -- so a tag build fails, loudly, if the key secrets are
#     missing. See BUILDING.md for making the key and adding the secrets.
name: Android build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug -PversionCode=$VERSION_CODE -PversionName=dev

      - uses: actions/upload-artifact@v5
        with:
          name: UnderwayBlackjack-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build signed release APK and bundle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release APKs must be signed with your upload key, or phones can't update from one release to the next. Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets (see BUILDING.md), then re-run this workflow."
            exit 1
          fi
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          ./gradlew --no-daemon assembleRelease bundleRelease \
            -PversionCode=$VERSION_CODE -PversionName="$VERSION_NAME" \
            -PuploadStoreFile="$RUNNER_TEMP/upload.jks" \
            -PuploadStorePassword="$KEYSTORE_PASSWORD" \
            -PuploadKeyAlias="$KEY_ALIAS" \
            -PuploadKeyPassword="$KEY_PASSWORD"
          rm -f "$RUNNER_TEMP/upload.jks"
          cp app/build/outputs/apk/release/app-release.apk ../UnderwayBlackjack-android.apk

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: UnderwayBlackjack-android.apk

      - uses: actions/upload-artifact@v5
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: UnderwayBlackjack-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
