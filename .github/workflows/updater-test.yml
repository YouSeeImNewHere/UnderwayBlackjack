name: Updater test (temporary)
on:
  push:
    branches: ["claude/wonderful-lamport-qxu9kq"]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build fake old version as UnderwayBlackjack.exe
        shell: pwsh
        run: |
          mkdir game
          Set-Content game/Cards.png "old"
          cl /nologo /std:c++20 /EHsc /O2 /DGAME_VERSION_STRING=\"1.0\" /Itools/updater-test /I. tools/updater-test/test.cpp /Fe:game/UnderwayBlackjack.exe winhttp.lib
          (Get-FileHash game/UnderwayBlackjack.exe).Hash
      - name: Run it
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd game
          ./UnderwayBlackjack.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem | Format-Table Name, Length
          if (-not (Test-Path UnderwayBlackjack.exe.old)) { throw "running exe was not moved aside" }
          if ((Get-Item Cards.png).Length -lt 1000) { throw "Cards.png not replaced" }
          $p = Start-Process ./UnderwayBlackjack.exe -PassThru
          Start-Sleep 5
          if ($p.HasExited) { throw "new exe exited early with $($p.ExitCode)" }
          "new version is running"
          Stop-Process $p
