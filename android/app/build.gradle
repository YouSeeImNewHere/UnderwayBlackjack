plugins {
    id 'com.android.application'
}

// Bump versionName for each release; versionCode must go up on every
// upload to Google Play (CI passes the run number as -PversionCode=N).
def appVersionCode = project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 1

android {
    namespace = "com.youseeimnewhere.underwayblackjack"
    compileSdkVersion 35
    ndkVersion = "28.2.13676358"

    defaultConfig {
        applicationId "com.youseeimnewhere.underwayblackjack"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode appVersionCode
        versionName "1.0"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_static"
                // 64-bit ARM covers essentially every phone in use; x86_64
                // is for the Android Studio emulator on an Intel/AMD PC.
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    // Release builds are signed with your upload key when these four
    // properties are given (CI passes them from repository secrets --
    // see BUILDING.md); otherwise release falls back to the debug key so
    // it still builds.
    signingConfigs {
        release {
            if (project.hasProperty('uploadStoreFile')) {
                storeFile file(project.property('uploadStoreFile'))
                storePassword project.property('uploadStorePassword')
                keyAlias project.property('uploadKeyAlias')
                keyPassword project.property('uploadKeyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig project.hasProperty('uploadStoreFile') ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            // The same CMakeLists.txt the iOS and Windows builds use.
            path '../../CMakeLists.txt'
            // The Android SDK's own CMake package (Android Studio installs it on
            // first build).
            version '3.22.1'
        }
    }

    // The game loads Cards.png etc. by relative path; on Android SDL looks
    // those up in the APK's assets. Copied in from the repo root at build
    // time so there's still only one copy of each image in the repo.
    sourceSets.main.assets.srcDirs += ["$buildDir/generated/gameAssets"]

    lint {
        abortOnError = false
    }
}

tasks.register('copyGameAssets', Copy) {
    from('../..') {
        include 'Cards.png', 'Table5Player.png', 'Arrow.png', 'Chips.png'
    }
    into "$buildDir/generated/gameAssets"
}
preBuild.dependsOn copyGameAssets
