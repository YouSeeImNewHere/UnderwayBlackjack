plugins {
    id 'com.android.application'
}

// CI passes both: versionCode (the run number -- it must go up on every
// update, or Android and Google Play refuse it) and versionName (the
// release tag without its "v", e.g. 1.2, so update tools like Obtainium
// see the same version as the GitHub release).
def appVersionCode = project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 1
def appVersionName = project.hasProperty('versionName') ? project.property('versionName') : "dev"

android {
    namespace = "com.youseeimnewhere.underwayblackjack"
    compileSdkVersion 35
    ndkVersion = "28.2.13676358"

    defaultConfig {
        applicationId "com.youseeimnewhere.underwayblackjack"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode appVersionCode
        versionName appVersionName
        // The home-screen name (the debug build type overrides it below).
        resValue "string", "app_name", "Blackjack Variants"
        externalNativeBuild {
            cmake {
                // GAME_VERSION: shown on the main menu ("dev" shows nothing).
                arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_static", "-DGAME_VERSION=${appVersionName}"
                // 64-bit ARM covers essentially every phone in use; x86_64
                // is for the Android Studio emulator on an Intel/AMD PC.
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    // Release builds are signed with your upload key when these four
    // properties are given (CI passes them from repository secrets --
    // see BUILDING.md); otherwise release falls back to the debug key so
    // it still builds.
    signingConfigs {
        release {
            if (project.hasProperty('uploadStoreFile')) {
                storeFile file(project.property('uploadStoreFile'))
                storePassword project.property('uploadStorePassword')
                keyAlias project.property('uploadKeyAlias')
                keyPassword project.property('uploadKeyPassword')
            }
        }
    }

    buildTypes {
        // Debug builds (every push's test APK) install as a separate app,
        // "Blackjack Variants (dev)", so they never clash with the release
        // install -- each CI machine signs debug builds with its own
        // throwaway key, which Android won't accept as an update.
        debug {
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "Blackjack Variants (dev)"
        }
        release {
            minifyEnabled false
            signingConfig project.hasProperty('uploadStoreFile') ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            // The same CMakeLists.txt the iOS and Windows builds use.
            path '../../CMakeLists.txt'
            // The Android SDK's own CMake package (Android Studio installs it on
            // first build).
            version '3.22.1'
        }
    }

    // The game loads Cards.png etc. by relative path; on Android SDL looks
    // those up in the APK's assets. Copied in from the repo root at build
    // time so there's still only one copy of each image in the repo.
    sourceSets.main.assets.srcDirs += ["$buildDir/generated/gameAssets"]

    lint {
        abortOnError = false
    }
}

tasks.register('copyGameAssets', Copy) {
    from('../..') {
        include 'Cards.png', 'Table5Player.png', 'Arrow.png', 'Chips.png'
    }
    // Sound effects, flat beside the images (see Audio.h).
    from('../../sounds') {
        include '*.wav'
    }
    into "$buildDir/generated/gameAssets"
}
preBuild.dependsOn copyGameAssets
